<!doctype html>
<html lang="de-CH">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMA-Feedback · Lehrerbereich</title>
<style>
body{margin:0 auto;max-width:50rem;padding:1.5rem;background:#f2f5ed;color:#172d2b;font:1rem/1.5 system-ui}article{background:white;border:1px solid #d5dfd4;border-radius:.7rem;padding:1rem;margin:1rem 0}button{font:inherit;margin-right:.65rem;padding:.5rem .75rem;cursor:pointer}h2{font-size:1.05rem}
</style>
<main>
<a href="/">Zum Feedbackformular</a>
<h1>Lehrerbereich</h1>
<p>Freigegebene Kommentare erscheinen bei der jeweiligen Präsentation.</p>
<p id="comment-mode" role="status">Status wird geladen …</p>
<button id="start-comments" disabled>Kommentarfunktion starten</button>
<button id="close-comments" disabled>Kommentarfunktion schliessen</button>
<button id="refresh">Pool aktualisieren</button>
<p id="status" role="status"></p>
<section id="pool" aria-label="Offene Kommentare"></section>
<h2>Veröffentlichte Kommentare</h2>
<section id="published" aria-label="Veröffentlichte Kommentare"></section>
</main>
<script type="module">
import {titles,prompts} from './feedback.mjs';
const pool = document.querySelector('#pool');
const status = document.querySelector('#status');
const mode = document.querySelector('#comment-mode');
const start = document.querySelector('#start-comments');
const close = document.querySelector('#close-comments');
let modeBusy = false;
async function changeMode(open) {
  if (modeBusy) return;
  modeBusy = true;
  start.disabled = close.disabled = true;
  try {
    const response = await fetch('/api/lehrer/kommentare', open === undefined ? {} : {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({open})
    });
    if (!response.ok) throw new Error();
    const current = (await response.json()).open;
    if (typeof current !== 'boolean') throw new Error();
    mode.textContent = current ? 'Kommentarfunktion ist geöffnet.' : 'Kommentarfunktion ist geschlossen.';
    start.disabled = current;
    close.disabled = !current;
  } catch {
    mode.textContent = 'Status konnte nicht bestätigt werden. Bitte aktualisiere den Pool.';
  } finally {
    modeBusy = false;
  }
}
start.addEventListener('click', () => changeMode(true));
close.addEventListener('click', () => changeMode(false));
async function loadPending() {
  const response = await fetch('/api/lehrer');
  if (!response.ok) throw new Error('Der Pool konnte nicht geladen werden.');
  const rows = await response.json();
  pool.replaceChildren();
  if (!rows.length) pool.textContent = 'Keine offenen Kommentare.';
  for (const row of rows) {
    const card = document.createElement('article');
    const title = document.createElement('h2');
    title.textContent = titles[row.talk - 1] + ' · ' + row.initials;
    const comment = document.createElement('p');
    comment.textContent = prompts[row.prompt] + ' ' + row.detail;
    card.append(title,comment);
    for (const [state,label] of [['approved','Veröffentlichen'],['deleted','Löschen']]) {
      const button = document.createElement('button');
      button.textContent = label;
      button.addEventListener('click',async () => {
        card.querySelectorAll('button').forEach(control => { control.disabled = true; });
        try {
          const response = await fetch('/api/lehrer',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id:row.id,state})
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          status.textContent = state === 'approved' ? 'Kommentar veröffentlicht.' : 'Kommentar gelöscht.';
          await load();
        } catch (error) {
          status.textContent = error.message;
          card.querySelectorAll('button').forEach(control => { control.disabled = false; });
        }
      });
      card.append(button);
    }
    pool.append(card);
  }
}
const published = document.querySelector('#published');
async function loadPublished() {
  const response = await fetch('/api/lehrer/publiziert');
  if (!response.ok) throw new Error('Veröffentlichte Kommentare konnten nicht geladen werden.');
  const rows = await response.json();
  published.replaceChildren();
  if (!rows.length) published.textContent = 'Keine veröffentlichten Kommentare.';
  for (const row of rows) {
    const card = document.createElement('article');
    const title = document.createElement('h3');
    title.textContent = titles[row.talk - 1] + ' · ' + row.initials;
    const preview = document.createElement('p');
    preview.textContent = prompts[row.prompt] + (row.detail ? ' ' + row.detail : '');
    const edit = document.createElement('button');
    edit.textContent = 'Bearbeiten';
    const withdraw = document.createElement('button');
    withdraw.textContent = 'Zurückziehen';
    const form = document.createElement('form');
    form.hidden = true;
    const promptLabel = document.createElement('label');
    const prompt = document.createElement('select');
    promptLabel.textContent = 'Rückmeldung ';
    prompts.forEach((value, index) => prompt.add(new Option(value,index)));
    prompt.value = row.prompt;
    promptLabel.append(prompt);
    const detailLabel = document.createElement('label');
    const detail = document.createElement('textarea');
    detailLabel.textContent = ' Ergänzung ';
    detail.value = row.detail;
    detail.maxLength = 140;
    detailLabel.append(detail);
    const save = document.createElement('button');
    save.textContent = 'Änderungen speichern';
    form.append(promptLabel,detailLabel,save);
    edit.addEventListener('click', () => {
      form.hidden = !form.hidden;
      if (!form.hidden) prompt.focus();
    });
    async function apply(action, values = {}) {
      for (const control of [edit,withdraw,save]) control.disabled = true;
      try {
        const response = await fetch('/api/lehrer/publiziert',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:row.id,action,...values})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        status.textContent = action === 'withdraw' ? 'Kommentar zurückgezogen.' : 'Änderungen veröffentlicht.';
        await load();
      } catch (error) {
        status.textContent = error.message;
        for (const control of [edit,withdraw,save]) control.disabled = false;
      }
    }
    withdraw.addEventListener('click', () => apply('withdraw'));
    form.addEventListener('submit', event => {
      event.preventDefault();
      apply('edit',{prompt:Number(prompt.value),detail:detail.value});
    });
    card.append(title,preview,edit,withdraw,form);
    published.append(card);
  }
}
function load() {
  return Promise.all([loadPending(),loadPublished()]);
}
function refresh() {
  changeMode();
  load().catch(error => { status.textContent = error.message; });
}
document.querySelector('#refresh').addEventListener('click',refresh);
refresh();
</script>
</html>
